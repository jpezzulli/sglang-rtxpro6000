name: 🐞 Bug report
description: Report a bug to help us reproduce and fix it.
title: "[Bug] "
labels: ['Bug']

body:
- type: markdown
  attributes:
    value: |
      Thanks for reporting a problem with Pennyroyal. Questions and field reports
      are welcome in this repository too. Share what you ran and what happened;
      you do not need a minimal reproducer to report an intermittent failure.
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I checked existing issues for the same problem.
      - label: I included my Pennyroyal version or source commit and relevant launch settings below.
- type: textarea
  attributes:
    label: Describe the bug
    description: A clear, concise description of the bug.
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproduction
    description: Model, launch command or profile, relevant settings, and steps or workload that triggered the problem. Include the error or log excerpt if available.
    placeholder: Paste the command here.
  validations:
    required: true
- type: textarea
  attributes:
    label: Environment
    description: Include GPU(s), RAM, OS, Pennyroyal version or source commit, and whether you use the container or a native install. Output from `python3 -m sglang.check_env` is helpful if available.
    placeholder: Describe your setup here.
  validations:
    required: true

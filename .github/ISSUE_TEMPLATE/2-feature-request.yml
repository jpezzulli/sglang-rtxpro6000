name: 🚀 Feature request
description: Suggest an improvement to Pennyroyal.
title: "[Feature] "

body:
- type: markdown
  attributes:
    value: |
      Have an idea for Pennyroyal? Tell us what you want to do and how the change
      would help. Questions and field reports are welcome here too.
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I checked existing issues for a similar request.
- type: textarea
  attributes:
    label: Motivation
    description: |
      Clearly and concisely describe the feature's motivation.
  validations:
    required: true
- type: textarea
  attributes:
    label: Related resources
    description: |
      Provide official releases or third-party implementations if available.

name: Archive repository traffic

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-repository-traffic
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'jpezzulli/sglang-rtxpro6000' && github.ref == 'refs/heads/pennyroyal-main-sm120-final'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve collector via Contents API (no repository checkout)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/archive_traffic.py?ref=${GITHUB_SHA}" \
            > "${RUNNER_TEMP}/archive_traffic.py"
          test -s "${RUNNER_TEMP}/archive_traffic.py"
      - name: Collect, merge and atomically archive traffic
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAFFIC_READ_TOKEN: ${{ secrets.TRAFFIC_READ_TOKEN }}
        shell: bash
        run: python3 "${RUNNER_TEMP}/archive_traffic.py"

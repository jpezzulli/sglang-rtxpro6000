# Operational NIXL settings for the prebuilt container, passed to SGLang as
# --hicache-storage-backend-extra-config @<this file>. Copy of the qualified
# configs/pennyroyal/nixl-posix-frspec.toml the released image carries; edit it here instead of
# rebuilding the image. The watermarks are whole-filesystem occupancy percentages
# for the volume mounted at /nixl, so review them for your own filesystem.
# FR-Spec qualification: dedicated 1 TB NIXL filesystem, POSIX/io_uring/O_DIRECT.
# Whole-filesystem occupancy thresholds, not a cache-directory byte quota.
# Review for your filesystem; inactive namespaces need separate lifecycle handling.
use_direct_io = true
l3_cleaner_enabled = true
l3_cleaner_high_watermark = 85.0
l3_cleaner_low_watermark = 80.0

[plugin.posix]
active = true
use_uring = "true"
